    <script>
        (function () {
          const isLightMode = localStorage.getItem('IS_LIGHT_MODE') ?? 'true';
          const theme = isLightMode === 'true' ? 'light' : 'dark';
          const themeColor = isLightMode === 'true' ? '#F8F8FF' : '#1C1C20';
          document.documentElement.setAttribute('data-theme', theme);
          let metaTag = document.querySelector('meta[name="theme-color"]');
          if (!metaTag) {
            metaTag = document.createElement('meta');
            metaTag.setAttribute('name', 'theme-color');
            document.head.appendChild(metaTag);
          }
          metaTag.setAttribute('content', themeColor);
        })();

         if (
          navigator.userAgent.indexOf("Safari") !== -1 &&
          navigator.userAgent.indexOf("Chrome") === -1
        ) {
          var originalGetContext = HTMLCanvasElement.prototype.getContext;
          HTMLCanvasElement.prototype.getContext = function () {
            var contextType = arguments[0];
            if (contextType === "webgl2") {
              return;
            }
            return originalGetContext.apply(
              this,
              [contextType].concat(Array.prototype.slice.call(arguments, 1)),
            );
          };
        }
    </script>

    <script>
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          console.log('✅ beforeinstallprompt event captured');

          // Optionally notify Flutter (use `html.window.addEventListener('pwa-install-available')` in Dart)
          window.dispatchEvent(new CustomEvent('pwa-install-available'));
        });

        window.triggerInstallPrompt = async function () {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const result = await deferredPrompt.userChoice;
            deferredPrompt = null;
          } else {
            alert('Install prompt is not available.');
          }
        };
    </script>

<script>
    function isPwaMode() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    }

    function checkLandingPage() {
      const today = new Date().toISOString().split('T')[0];
      const lastRun = localStorage.getItem('LAST_DATE_SHOWN_LANDING_PAGE');

      if (lastRun !== today) {
        document.getElementById('landingPage').style.display = 'block';
        document.getElementById('splashArea').style.display = 'none';
        document.getElementById('cta').addEventListener('click', function() {
            localStorage.setItem('LAST_DATE_SHOWN_LANDING_PAGE', today);
            runFlutterApp();
        });
      } else {
        runFlutterApp();
      }
    }

    function runFlutterApp(){
        document.getElementById('splashArea').style.display = 'flex';
        document.getElementById('landingPage').style.display = 'none';

        const flutterScript = document.createElement('script');
        flutterScript.src = 'flutter_bootstrap.js'; // set the script source
        flutterScript.async = true; // optional: makes it load asynchronously
        document.body.appendChild(flutterScript);

        const script = document.createElement('script');
        script.src = 'ios_swift_touch.js'; // set the script source
        script.async = true; // optional: makes it load asynchronously
        document.body.appendChild(script);
    }
    if (isPwaMode()) {
      runFlutterApp();
    }else{
      checkLandingPage();
    }
</script>
