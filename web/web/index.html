<!DOCTYPE html>
<html lang="ko">
<head>
  <style>
    :root {
      --sat: env(safe-area-inset-top);
      --sar: env(safe-area-inset-right);
      --sab: env(safe-area-inset-bottom);
      --sal: env(safe-area-inset-left);
    }
  </style>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="최신 개발 동향을 빠르게 파악하고 싶다면, 개발자 신문이 정답입니다.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="개발자 신문">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="theme-color" content="#65A2D4">
<!--  <meta name="theme-color" content="#F8F8FF" media="(prefers-color-scheme: light)">-->
<!--  <meta name="theme-color" content="#1C1C20" media="(prefers-color-scheme: dark)">-->

  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta property="og:title" content="Balza News">
  <meta property="og:description" content="최신 개발 동향을 빠르게 파악하고 싶다면, 개발자 신문이 정답입니다">
  <meta property="og:url" content="https://balzanewss.web.app">
  <meta property="og:image" content="https://balzanewss.web.app/ogimage.png">
  <script>
    (function () {
      const isLightMode = localStorage.getItem('IS_LIGHT_MODE') ?? 'true';
      const theme = isLightMode === 'true' ? 'light' : 'dark';
      const themeColor = isLightMode === 'true' ? '#F8F8FF' : '#1C1C20';
      document.documentElement.setAttribute('data-theme', theme);
      let metaTag = document.querySelector('meta[name="theme-color"]');
      if (!metaTag) {
        metaTag = document.createElement('meta');
        metaTag.setAttribute('name', 'theme-color');
        document.head.appendChild(metaTag);
      }
      metaTag.setAttribute('content', themeColor);
    })();

     if (
      navigator.userAgent.indexOf("Safari") !== -1 &&
      navigator.userAgent.indexOf("Chrome") === -1
    ) {
      var originalGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function () {
        var contextType = arguments[0];
        if (contextType === "webgl2") {
          return;
        }
        return originalGetContext.apply(
          this,
          [contextType].concat(Array.prototype.slice.call(arguments, 1)),
        );
      };
    }
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <script src="init.js" defer></script>
  <link rel="stylesheet" type='text/css' href="styles.css">
  <title>개발자 신문</title>
  <link rel="manifest" href="manifest.json">
  <script>
    document.addEventListener(
      'touchstart',
      (startEvent) => {
        if (startEvent.touches.length > 1) return;
        startEvent.preventDefault();
      },
      { passive: false }
    );
  </script>
</head>
<body>
  <div class="splashArea" id="splashArea">
    <img id="logo" src="logo.png" alt="BalzaNews logo" />
  </div>
  <div id="app-area"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
